version: "3.9"

# ── AI Translation Provenance System — Docker Compose ─────────────────────────
#
# Profiles:
#   default  — app only (in-memory store, mock translation)
#   search   — app + Qdrant vector store
#   full     — app + Qdrant + Elasticsearch + PostgreSQL
#
# Quick start (development):
#   docker-compose up
#
# With persistent vector search:
#   docker-compose --profile search up
#
# Full production stack:
#   docker-compose --profile full up

services:

  # ── Main Application ─────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - TRANSLATION_PROVIDER=${TRANSLATION_PROVIDER:-mock}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - HAYSTACK_DOCUMENT_STORE=${HAYSTACK_DOCUMENT_STORE:-memory}
      - DATABASE_BACKEND=${DATABASE_BACKEND:-memory}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - ./app:/app/app
      - ./frontend:/app/frontend
      - model_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Qdrant Vector Store (profile: search, full) ───────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["search", "full"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── PostgreSQL (profile: full) ────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["full"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: provenance
      POSTGRES_USER: provenance_user
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provenance_user -d provenance"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Elasticsearch (profile: full) ─────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    profiles: ["full"]
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  qdrant_data:
  postgres_data:
  es_data:
  model_cache:
