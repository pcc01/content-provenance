version: "3.9"

# ── AI Translation Provenance System — Docker Compose ─────────────────────────
#
# Profiles:
#   default  — app + PostgreSQL (mock translation)
#   search   — + Qdrant vector store
#   full     — + Qdrant + Elasticsearch
#
# Quick start (development):
#   docker-compose up
#
# With persistent vector search:
#   docker-compose --profile search up
#
# Full stack (adds Elasticsearch too):
#   docker-compose --profile full up
#
# Host ports are deliberately offset from the obvious defaults (app 8001 not
# 8000, postgres 5433 not 5432) so this stack can run alongside another
# project's docker-compose stack using the standard ports on the same
# machine without colliding. Only the HOST side is offset — inside the
# Docker network the app still talks to postgres:5432 as normal.

services:

  # ── Main Application ─────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - TRANSLATION_PROVIDER=${TRANSLATION_PROVIDER:-mock}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - HAYSTACK_DOCUMENT_STORE=${HAYSTACK_DOCUMENT_STORE:-memory}
      - DATABASE_BACKEND=${DATABASE_BACKEND:-postgres}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-provenance}
      - POSTGRES_USER=${POSTGRES_USER:-provenance_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - IMAGE_STORAGE_DIR=${IMAGE_STORAGE_DIR:-/app/data/images}
      - EMAIL_NOTIFICATIONS_ENABLED=${EMAIL_NOTIFICATIONS_ENABLED:-false}
      - NOTIFY_EMAIL_TO=${NOTIFY_EMAIL_TO:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
    volumes:
      - ./app:/app/app
      - ./frontend:/app/frontend
      - model_cache:/root/.cache/huggingface
      - image_storage:/app/data/images
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Qdrant Vector Store (profile: search, full) ───────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["search", "full"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── PostgreSQL (default — the system of record for translations/provenance/XLIFF) ──
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-provenance}
      POSTGRES_USER: ${POSTGRES_USER:-provenance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-provenance_user} -d ${POSTGRES_DB:-provenance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Elasticsearch (profile: full) ─────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    profiles: ["full"]
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  qdrant_data:
  postgres_data:
  es_data:
  model_cache:
  image_storage:
